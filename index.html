<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاهر · Shaher</title>
<meta name="description" content="شاهر — Media Buyer و Performance Marketer. نظام نمو كامل لبراند الفاشون: ميديا باينج، كرييتف، تحويل وريتنشن.">
<meta property="og:title" content="شاهر · Shaher — Fashion Media Buyer">
<meta property="og:description" content="نظام نمو كامل لبراند الفاشون: ميديا باينج، كرييتف، تحويل وريتنشن.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="assets/img/logo/shaher-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-lang="ar">
<header class="nav">
  <div class="wrap nav-in">
    <a class="logo" href="#top"><span class="brand-text" data-i18n="brand">شاهر</span><span class="brand-dot">.</span></a>
    <nav class="links" id="navlinks"></nav>
    <div class="nav-right">
      <button class="lang-btn" id="langBtn"><i class="fa-solid fa-globe"></i> <span id="langLabel">EN</span></button>
      <a class="nav-cta" href="#contact"><i class="fa-solid fa-bolt"></i> <span class="t" data-i18n="navCta">Audit مجاني</span></a>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="top">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="eyebrow">Fashion Performance Marketing</p>
        <h1 id="heroH1"></h1>
        <p class="lead" data-i18n="heroLead"></p>
        <div class="tags">
          <span class="tag-pill"><i class="fa-brands fa-instagram"></i> Instagram Ads</span>
          <span class="tag-pill"><i class="fa-brands fa-facebook"></i> Facebook Ads</span>
          <span class="tag-pill"><i class="fa-brands fa-tiktok"></i> TikTok Ads</span>
          <span class="tag-pill"><i class="fa-brands fa-meta"></i> Meta</span>
        </div>
        <div class="cta-row">
          <a class="btn primary" href="#contact"><i class="fa-solid fa-bolt"></i> <span data-i18n="cta1"></span></a>
          <a class="btn ghost" href="#approach"><span data-i18n="cta2"></span></a>
        </div>
      </div>
      <div class="avatar-wrap">
        <div class="avatar"><img src="assets/img/shaher-avatar.png" alt="Shaher" width="700" height="700"></div>
        <div class="float-chip chip-a"><i class="fa-solid fa-arrow-trend-up"></i> <span data-i18n="chipA"></span></div>
        <div class="float-chip chip-b"><i class="fa-solid fa-sack-dollar"></i> <span data-i18n="chipB"></span></div>
      </div>
    </div>
    <div class="wrap"><div class="stats" id="statsBox"></div></div>
  </section>

  <section id="problem">
    <div class="wrap">
      <p class="eyebrow" data-i18n="probEye"></p>
      <h2 class="sec" data-i18n="probTitle"></h2>
      <div class="prob-grid" id="probGrid"></div>
      <p class="prob-close" id="probClose"></p>
    </div>
  </section>

  <section id="about">
    <div class="wrap about-grid">
      <div class="about-photo"><img src="assets/img/shaher-real.jpg" alt="Shaher"></div>
      <div class="about-body">
        <p class="eyebrow" data-i18n="aboutEye"></p>
        <h2 class="sec" data-i18n="aboutTitle"></h2>
        <div id="aboutBody"></div>
        <div class="sig" data-i18n="sig"></div>
      </div>
    </div>
  </section>

  <section id="approach">
    <div class="wrap">
      <p class="eyebrow" data-i18n="apprEye"></p>
      <blockquote class="approach-quote" data-i18n="apprQuote"></blockquote>
      <div class="principles" id="principles"></div>
    </div>
  </section>

  <section id="services">
    <div class="wrap">
      <p class="eyebrow" data-i18n="svcEye"></p>
      <h2 class="sec" data-i18n="svcTitle"></h2>
      <div class="svc-grid" id="svcGrid"></div>
    </div>
  </section>

  <section id="process">
    <div class="wrap">
      <p class="eyebrow" data-i18n="procEye"></p>
      <h2 class="sec" data-i18n="procTitle"></h2>
      <div class="steps" id="steps"></div>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <p class="eyebrow" data-i18n="resEye"></p>
      <h2 class="sec" data-i18n="resTitle"></h2>
      <div class="cases" id="cases"></div>
      <p class="priv-note" data-i18n="privNote"></p>
    </div>
  </section>

  <section id="proof">
    <div class="wrap">
      <p class="eyebrow" data-i18n="proofEye"></p>
      <h2 class="sec" data-i18n="proofTitle"></h2>
      <div class="proof-grid" id="proofGrid"></div>
    </div>
  </section>

  <section id="fit">
    <div class="wrap">
      <div class="fit-grid">
        <div class="fit good">
          <p class="eyebrow" style="color:var(--green)" data-i18n="fitGoodEye"></p>
          <h3 data-i18n="fitGoodTitle"></h3>
          <ul id="fitGood"></ul>
        </div>
        <div class="fit bad">
          <p class="eyebrow" style="color:var(--red)" data-i18n="fitBadEye"></p>
          <h3 data-i18n="fitBadTitle"></h3>
          <ul id="fitBad"></ul>
        </div>
      </div>
    </div>
  </section>

  <section id="faq">
    <div class="wrap">
      <p class="eyebrow" data-i18n="faqEye"></p>
      <h2 class="sec" data-i18n="faqTitle"></h2>
      <div class="faq-list" id="faqList"></div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <div class="contact-card">
        <h2 data-i18n="contactTitle"></h2>
        <p data-i18n="contactText"></p>
        <div class="contact-row">
          <a class="btn primary" id="waBtn" href="https://wa.me/201069799620" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> <span data-i18n="waBtn"></span></a>
          <a class="mail" id="mail" href="mailto:shaher.iowork@gmail.com">shaher.iowork@gmail.com</a>
        </div>
      </div>
    </div>
    <footer class="foot">
      <div class="wrap foot-in">
        <div><b>شاهر · Shaher</b> — Fashion Media Buyer · <span data-i18n="egypt"></span></div>
        <div>© <span id="yr"></span></div>
      </div>
    </footer>
  </section>
</main>
<script src="assets/js/app.js"></script>
</body>
</html>
